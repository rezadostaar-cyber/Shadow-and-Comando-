<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO & OSKAR - Shadow and Comando</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: url('https://files.catbox.moe/2x8q3r.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.70);
            z-index: 1;
        }
        .container {
            padding: 30px 20px 60px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .logo {
            font-size: 68px;
            font-weight: 900;
            letter-spacing: 10px;
            margin: 20px 0 10px;
            background: linear-gradient(90deg, #ff00aa, #00ffff, #ffff00, #ff00aa);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 7s ease-in-out infinite;
        }
        @keyframes shine {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1 {
            font-size: 32px;
            margin: 5px 0 15px;
            background: linear-gradient(90deg, #ff00aa, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #00ff88;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 45px;
        }
        .card {
            background: rgba(15, 15, 15, 0.92);
            border: 2px solid #00ff41;
            border-radius: 20px;
            padding: 24px 20px;
            margin: 18px auto;
            max-width: 90%;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }
        .card:active {
            transform: scale(0.96);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.8);
        }
        .card .emoji {
            font-size: 52px;
            margin-bottom: 6px;
        }
        .card h3 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: transparent !important;
            height: 0;
            overflow: hidden;
        }
        .footer {
            margin-top: 80px;
            color: #00ff88;
            font-size: 15px;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">XO OSKAR</div>
    <h1>Shadow and Comando</h1>
    <p>برای ورود کلیک کن</p>

    <div class="card" onclick="openChannel('shadow_alonex')">
        <div class="emoji">Shadow</div>
        <h3>@shadow_alonex</h3>
    </div>

    <div class="card" onclick="openChannel('NiCaToR_NKR')">
        <div class="emoji">Comando</div>
        <h3>@NiCaToR_NKR</h3>
    </div>

    <div class="card" onclick="openChannel('XO_OSKAR')">
        <div class="emoji">XO OSKAR</div>
        <h3>@XO_OSKAR</h3>
    </div>

    <div class="footer">
        ساخته شده توسط Shadow and Comando
    </div>
</div>

<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor('#000000');
    Telegram.WebApp.setBackgroundColor('#000000');

    function openChannel(username) {
        Telegram.WebApp.openTelegramLink('https://t.me/' + username);
    }
</script>
</body>
</html>
